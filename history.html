<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ยอดขายย้อนหลัง · Makro × Lemon Green Mart</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{font-family:'Noto Sans Thai',system-ui,sans-serif;color:#1f2a22;background:#f7faf5;--red:#d7141a;--green:#2e9e4f;--border:#e3ebe0;--muted:#66736a}
    *{box-sizing:border-box}body{margin:0}header{background:linear-gradient(100deg,var(--red),var(--green));color:white;padding:16px 22px;border-bottom:4px solid #a5d63f}h1{font-size:20px;margin:0}main{max-width:1200px;margin:auto;padding:16px}.card{background:white;border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:end}.field{display:grid;gap:5px}label,.hint{font-size:12px;color:var(--muted)}input,select{font:inherit;border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:white;color:inherit}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.kpi{border-top:4px solid var(--green)}.kpi b{display:block;font-size:23px;margin-top:3px}.scroll{overflow:auto;max-height:65vh}table{border-collapse:collapse;width:100%;min-width:700px}th,td{padding:8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#fff;color:var(--muted)}td.num,th.num{text-align:right}.status{font-size:13px;margin-top:10px}.error{color:#c00}.notice{background:#fff8df;border:1px solid #f1df9b;border-radius:8px;padding:10px;margin-bottom:14px}a{color:inherit}@media(max-width:600px){main{padding:10px}.card{padding:12px}}
  </style>
</head>
<body>
  <header><h1>📅 ดูยอดขายย้อนหลัง · Makro × Lemon Green Mart</h1></header>
  <main>
    <div class="notice">เลือกวันที่เพื่อดูข้อมูลยอดขายจากไฟล์ที่เคยเผยแพร่ไว้ใน Dashboard นี้ หน้านี้เป็นหน้าดูข้อมูลสาธารณะ ไม่มีช่องให้ใส่ GitHub token</div>
    <section class="card controls">
      <div class="field"><label for="date">วันที่ต้องการดู</label><select id="date"><option>กำลังโหลด…</option></select></div>
      <div class="field"><label for="region">ภูมิภาค</label><select id="region"><option value="ALL">ทุกภูมิภาค</option></select></div>
      <div class="field"><label for="search">ค้นหาสาขา / รหัส</label><input id="search" type="search" placeholder="พิมพ์ชื่อหรือรหัสสาขา"></div>
    </section>
    <section class="kpis" id="kpis"></section>
    <section class="card"><h2>รายละเอียดสาขา</h2><div class="scroll"><table id="table"></table></div></section>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </main>
<script>
'use strict';
const OWNER='psujarit',REPO='makro-lemongreen-dashboard',API='https://api.github.com/repos/'+OWNER+'/'+REPO;
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'฿'+Math.round(Number(n)||0).toLocaleString('en-US');let snapshots={};
function dateLabel(iso){return new Date(iso+'T00:00:00').toLocaleDateString('th-TH',{year:'numeric',month:'short',day:'numeric'});}
function setStatus(text,bad=false){$('status').textContent=text;$('status').className='status'+(bad?' error':'');}
async function json(url){const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub API ตอบกลับ '+r.status);return r.json();}
async function readSnapshot(sha){const r=await fetch('https://raw.githubusercontent.com/'+OWNER+'/'+REPO+'/'+sha+'/data.json');if(!r.ok)throw Error('อ่านข้อมูลใน commit ไม่สำเร็จ');const d=await r.json();const cur=d['ds/cur'];if(cur&&cur.date&&Array.isArray(cur.rows))return cur;const history=d['ds/dailyHistory']||{};return Object.values(history).filter(x=>x&&x.date&&Array.isArray(x.rows)).sort((a,b)=>b.date.localeCompare(a.date))[0]||null;}
async function load(){try{setStatus('กำลังค้นหาข้อมูลรายวันที่เคยเผยแพร่…');const commits=await json(API+'/commits?path=data.json&per_page=100');if(!Array.isArray(commits)||!commits.length)throw Error('ยังไม่พบประวัติ data.json ใน repository');let next=0,done=0;const workers=Array.from({length:6},async()=>{while(next<commits.length){const c=commits[next++];try{const snap=await readSnapshot(c.sha);if(snap)snapshots[snap.date]=snap;}catch(e){}done++;if(done%10===0)setStatus('กำลังตรวจข้อมูล '+done+' / '+commits.length+' commits…');}});await Promise.all(workers);const dates=Object.keys(snapshots).sort().reverse();$('date').innerHTML=dates.length?dates.map(d=>'<option value="'+esc(d)+'">'+esc(dateLabel(d))+'</option>').join(''):'<option value="">ไม่พบ snapshot</option>';render();setStatus(dates.length?'พร้อมแล้ว · พบข้อมูล '+dates.length+' วันที่':'ไม่พบ snapshot ในประวัติ data.json',!dates.length);}catch(e){setStatus((e.message||String(e))+' — ลองโหลดหน้าใหม่อีกครั้ง',true);$('date').innerHTML='<option value="">โหลดข้อมูลไม่สำเร็จ</option>';}}
function render(){const snap=snapshots[$('date').value];if(!snap){$('kpis').innerHTML='<div class="card">ยังไม่มีข้อมูลในวันที่เลือก</div>';$('table').innerHTML='';$('region').innerHTML='<option value="ALL">ทุกภูมิภาค</option>';return;}const rows=snap.rows,total=rows.reduce((s,r)=>s+(Number(r[6])||0),0),regions=[...new Set(rows.map(r=>String(r[2]||'')))].sort(),prev=$('region').value;$('region').innerHTML='<option value="ALL">ทุกภูมิภาค</option>'+regions.map(r=>'<option value="'+esc(r)+'">'+esc(r||'ไม่ระบุ')+'</option>').join('');if(regions.includes(prev))$('region').value=prev;$('kpis').innerHTML='<div class="card kpi"><span class="hint">วันที่ของข้อมูล</span><b>'+esc(dateLabel(snap.date))+'</b></div><div class="card kpi"><span class="hint">ยอดขายรวม</span><b>'+money(total)+'</b></div><div class="card kpi"><span class="hint">จำนวนสาขา</span><b>'+rows.length.toLocaleString('th-TH')+'</b></div>';const q=$('search').value.trim().toLocaleLowerCase(),filtered=rows.filter(r=>($('region').value==='ALL'||String(r[2]||'')===$('region').value)&&(!q||(String(r[1]||'')+' '+String(r[0]||'')+' '+String(r[5]||'')+' '+String(r[4]||'')).toLocaleLowerCase().includes(q))).sort((a,b)=>(Number(b[6])||0)-(Number(a[6])||0));$('table').innerHTML='<thead><tr><th>#</th><th>สาขา</th><th>รหัสสาขา</th><th>ภูมิภาค</th><th class="num">ยอดขาย</th></tr></thead><tbody>'+filtered.map((r,i)=>'<tr><td>'+(i+1)+'</td><td>'+esc(r[1]||r[5]||'')+'</td><td>'+esc(r[0]||r[4]||'')+'</td><td>'+esc(r[2]||'')+'</td><td class="num">'+money(r[6])+'</td></tr>').join('')+'</tbody>';}
$('date').addEventListener('change',render);$('region').addEventListener('change',render);$('search').addEventListener('input',render);load();
</script>
</body>
</html>
